<style>
/* Quasaria Quasar hero. Backgrounds only; no gradient text. Motion: one slow transform, off under reduced motion. */
.qz { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; contain: strict; }
.qz-haze { position: absolute; inset: -10%;
  background:
    radial-gradient(38% 46% at 74% 42%, rgba(139,124,255,.30), transparent 70%),
    radial-gradient(30% 40% at 86% 30%, rgba(34,211,238,.16), transparent 70%),
    radial-gradient(45% 60% at 10% 100%, rgba(109,74,255,.14), transparent 70%),
    radial-gradient(60% 50% at 50% 0%, rgba(34,211,238,.06), transparent 70%); }
.qz-stars { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .8; }
.qz-obj { position: absolute; right: 4%; top: 50%; width: min(46vw, 560px); aspect-ratio: 1; transform: translateY(-50%); }
.qz-halo { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(196,181,253,.38) 0%, rgba(139,124,255,.18) 30%, rgba(34,211,238,.07) 52%, transparent 70%); }
.qz-jets { position: absolute; left: 50%; top: -30%; height: 160%; width: 12%; transform: translateX(-50%) rotate(-14deg); opacity: .8; }
.qz-tilt { position: absolute; inset: 0; transform: rotate(-14deg) scaleY(.32); }
.qz-spin { position: absolute; inset: 0; will-change: transform; animation: qz-spin 120s linear infinite; }
.qz-spin svg { width: 100%; height: 100%; display: block; }
.qz-core { position: absolute; left: 50%; top: 50%; width: 15%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, #e9e6ff 22%, rgba(165,243,252,.85) 38%, rgba(139,124,255,.45) 62%, transparent 74%);
  box-shadow: 0 0 60px 18px rgba(139,124,255,.35), 0 0 120px 40px rgba(34,211,238,.12); }
@keyframes qz-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .qz-spin { animation: none; } }
/* readable text over the hero: a left scrim behind the copy column */
.qz-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,18,31,.92) 0%, rgba(20,18,31,.78) 42%, rgba(20,18,31,.15) 70%, transparent 100%); }
@media (max-width: 760px) {
  .qz-obj { width: 92vw; right: -30vw; top: 38%; opacity: .75; }
  .qz-scrim { background: linear-gradient(180deg, rgba(20,18,31,.55) 0%, rgba(20,18,31,.88) 60%, rgba(20,18,31,.95) 100%); }
}
.qz-orbits { position: absolute; pointer-events: none; z-index: 0; }

html,body{margin:0;background:#14121f;color:#ecebf5}
body{font-family:system-ui,sans-serif;min-height:100vh}
.root-hero{position:relative;isolation:isolate;min-height:100vh;display:flex;align-items:center}
.root-hero .qz-obj{right:2%;width:min(52vw,620px)}
.root-copy{position:relative;z-index:1;max-width:40rem;margin:3rem auto;padding:0 1rem;width:100%}
.root-copy h1{font-size:2.6rem;margin:0 0 .6rem}
.root-copy p{color:#a9a4c4;line-height:1.6}
.root-copy strong{color:#ecebf5}
.root-copy a{color:#a5f3fc}
@media (min-width:900px){.root-copy{margin-left:8vw}}
@media (max-width:760px){.root-hero{align-items:flex-end} .root-hero .qz-obj{top:26%;right:-25vw;width:110vw}}
</style></head>
